version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Enable BuildKit for caching
      cache_from:
        - go-base:latest
    image: go-base:latest
    container_name: go-base-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ENV=production
      - PORT=8080
      # Add other environment variables as needed
    env_file:
      - .env
    networks:
      - go-base
    volumes:
      # Mount config files if needed
      - ./private_key.pem:/app/private_key.pem:ro
      - ./public_key.pem:/app/public_key.pem:ro

networks:
  default:
    name: go-base
    driver: bridge
