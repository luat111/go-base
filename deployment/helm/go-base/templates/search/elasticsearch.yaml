{{- if and (eq .Values.search.provider "elasticsearch") .Values.search.elasticsearch.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "go-base.fullname" . }}-elasticsearch-config
  labels:
    {{- include "go-base.labels" . | nindent 4 }}
    app.kubernetes.io/component: search
data:
  elasticsearch.yml: |
    cluster.name: {{ .Values.search.elasticsearch.config.clusterName }}
    network.host: 0.0.0.0
    discovery.type: {{ .Values.search.elasticsearch.config.discoveryType }}
    xpack.security.enabled: {{ .Values.search.elasticsearch.config.xpackSecurityEnabled }}
    xpack.security.enrollment.enabled: false
    xpack.security.http.ssl.enabled: false
    xpack.security.transport.ssl.enabled: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "go-base.fullname" . }}-elasticsearch
  labels:
    {{- include "go-base.labels" . | nindent 4 }}
    app.kubernetes.io/component: search
spec:
  serviceName: {{ include "go-base.fullname" . }}-elasticsearch
  replicas: {{ .Values.search.elasticsearch.replicaCount }}
  selector:
    matchLabels:
      {{- include "go-base.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: search
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/search/elasticsearch.yaml") . | sha256sum }}
        {{- include "go-base.linkerd.annotations" . | nindent 8 }}
      labels:
        {{- include "go-base.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: search
    spec:
      initContainers:
      # Increase vm.max_map_count for Elasticsearch
      - name: sysctl
        image: busybox:latest
        command:
        - sysctl
        - -w
        - vm.max_map_count=262144
        securityContext:
          privileged: true
      containers:
      - name: elasticsearch
        image: "{{ .Values.search.elasticsearch.image.repository }}:{{ .Values.search.elasticsearch.image.tag }}"
        imagePullPolicy: {{ .Values.search.elasticsearch.image.pullPolicy }}
        ports:
        - containerPort: 9200
          name: http
          protocol: TCP
        - containerPort: 9300
          name: transport
          protocol: TCP
        env:
        - name: ES_JAVA_OPTS
          value: {{ .Values.search.elasticsearch.config.javaOpts | quote }}
        - name: discovery.type
          value: {{ .Values.search.elasticsearch.config.discoveryType }}
        - name: cluster.name
          value: {{ .Values.search.elasticsearch.config.clusterName }}
        - name: xpack.security.enabled
          value: {{ .Values.search.elasticsearch.config.xpackSecurityEnabled | quote }}
        volumeMounts:
        - name: config
          mountPath: /usr/share/elasticsearch/config/elasticsearch.yml
          subPath: elasticsearch.yml
        - name: data
          mountPath: /usr/share/elasticsearch/data
        resources:
          {{- toYaml .Values.search.elasticsearch.resources | nindent 12 }}
        livenessProbe:
          httpGet:
            path: /_cluster/health
            port: 9200
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /_cluster/health?wait_for_status=yellow&timeout=5s
            port: 9200
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: config
        configMap:
          name: {{ include "go-base.fullname" . }}-elasticsearch-config
  {{- if .Values.search.elasticsearch.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- if .Values.search.elasticsearch.persistence.storageClass }}
      storageClassName: {{ .Values.search.elasticsearch.persistence.storageClass }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.search.elasticsearch.persistence.size }}
  {{- else }}
      - name: data
        emptyDir: {}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-base.fullname" . }}-elasticsearch
  labels:
    {{- include "go-base.labels" . | nindent 4 }}
    app.kubernetes.io/component: search
spec:
  type: {{ .Values.search.elasticsearch.service.type }}
  ports:
  - port: {{ .Values.search.elasticsearch.service.httpPort }}
    targetPort: http
    protocol: TCP
    name: http
  - port: {{ .Values.search.elasticsearch.service.transportPort }}
    targetPort: transport
    protocol: TCP
    name: transport
  selector:
    {{- include "go-base.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: search
{{- end }}
