{{- if and (eq .Values.search.provider "manticore") .Values.search.manticore.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "go-base.fullname" . }}-manticore-config
  labels:
    {{- include "go-base.labels" . | nindent 4 }}
    app.kubernetes.io/component: search
data:
  manticore.conf: |
    searchd {
        listen = 9306:mysql41
        listen = 9308:http
        listen = 9312
        listen = 9315-9325:replication
        log = /var/log/manticore/searchd.log
        query_log = /var/log/manticore/query.log
        pid_file = /var/run/manticore/searchd.pid
        binlog_path = /var/lib/manticore/data
        max_matches = {{ .Values.search.manticore.config.maxMatches }}
        rt_mem_limit = {{ .Values.search.manticore.config.rtMemLimit }}
        threads = {{ .Values.search.manticore.config.threads }}
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "go-base.fullname" . }}-manticore
  labels:
    {{- include "go-base.labels" . | nindent 4 }}
    app.kubernetes.io/component: search
spec:
  serviceName: {{ include "go-base.fullname" . }}-manticore
  replicas: {{ .Values.search.manticore.replicaCount }}
  selector:
    matchLabels:
      {{- include "go-base.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: search
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/search/manticore.yaml") . | sha256sum }}
        {{- include "go-base.linkerd.annotations" . | nindent 8 }}
      labels:
        {{- include "go-base.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: search
    spec:
      containers:
      - name: manticore
        image: "{{ .Values.search.manticore.image.repository }}:{{ .Values.search.manticore.image.tag }}"
        imagePullPolicy: {{ .Values.search.manticore.image.pullPolicy }}
        ports:
        - containerPort: 9306
          name: mysql
          protocol: TCP
        - containerPort: 9308
          name: http
          protocol: TCP
        - containerPort: 9312
          name: binary
          protocol: TCP
        env:
        - name: EXTRA
          value: "--config /etc/manticore/manticore.conf"
        volumeMounts:
        - name: config
          mountPath: /etc/manticore
        - name: data
          mountPath: /var/lib/manticore
        - name: logs
          mountPath: /var/log/manticore
        resources:
          {{- toYaml .Values.search.manticore.resources | nindent 12 }}
        livenessProbe:
          tcpSocket:
            port: 9306
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 9306
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: {{ include "go-base.fullname" . }}-manticore-config
      - name: logs
        emptyDir: {}
  {{- if .Values.search.manticore.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- if .Values.search.manticore.persistence.storageClass }}
      storageClassName: {{ .Values.search.manticore.persistence.storageClass }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.search.manticore.persistence.size }}
  {{- else }}
      - name: data
        emptyDir: {}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-base.fullname" . }}-manticore
  labels:
    {{- include "go-base.labels" . | nindent 4 }}
    app.kubernetes.io/component: search
spec:
  type: {{ .Values.search.manticore.service.type }}
  ports:
  - port: {{ .Values.search.manticore.service.sqlPort }}
    targetPort: mysql
    protocol: TCP
    name: mysql
  - port: {{ .Values.search.manticore.service.httpPort }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "go-base.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: search
{{- end }}
