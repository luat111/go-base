apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-base.fullname" . }}
  labels:
    {{- include "go-base.labels" . | nindent 4 }}
  {{- with .Values.app.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.app.service.type }}
  ports:
    - port: {{ .Values.app.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if .Values.serviceMesh.enabled }}
      {{- if .Values.serviceMesh.linkerd.http2.enabled }}
      appProtocol: HTTP2
      {{- end }}
      {{- end }}
  selector:
    {{- include "go-base.selectorLabels" . | nindent 4 }}
