# Production values for go-base
# Override default values for production environment

global:
  environment: production
  domain: your-domain.com

app:
  replicaCount: 5
  
  image:
    repository: your-registry.azurecr.io/go-base
    tag: "v1.0.0"
    pullPolicy: IfNotPresent
  
  resources:
    limits:
      cpu: 2000m
      memory: 1Gi
    requests:
      cpu: 1000m
      memory: 512Mi
  
  autoscaling:
    enabled: true
    minReplicas: 5
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 75

postgresql:
  enabled: true
  auth:
    username: postgres
    password: "CHANGE_ME_IN_PRODUCTION"
    database: go_base_prod
  primary:
    persistence:
      enabled: true
      size: 50Gi
      storageClass: "premium-ssd"
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 1000m
        memory: 2Gi

pgpool:
  enabled: true
  replicaCount: 3

redis:
  enabled: true
  auth:
    enabled: true
    password: "CHANGE_ME_IN_PRODUCTION"
  master:
    persistence:
      enabled: true
      size: 20Gi
      storageClass: "premium-ssd"
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi

rabbitmq:
  enabled: true
  auth:
    username: admin
    password: "CHANGE_ME_IN_PRODUCTION"
  persistence:
    enabled: true
    size: 20Gi
    storageClass: "premium-ssd"
  replicaCount: 3
  clustering:
    enabled: true

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: api.your-domain.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: go-base-prod-tls
      hosts:
        - api.your-domain.com

# Production secrets (use external secret management in real production)
secrets:
  PG_USER: "postgres"
  PG_PWD: "CHANGE_ME"
  CACHE_PWD: "CHANGE_ME"
  RMQ_USER: "admin"
  RMQ_PWD: "CHANGE_ME"
  JWT_SECRET: "CHANGE_ME"
