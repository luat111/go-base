exporters:
  otlp:
    endpoint: "jaeger:4317"
    tls:
      insecure: true
  prometheus:
    endpoint: "otelcol:9464"
    resource_to_telemetry_conversion:
      enabled: true
    enable_open_metrics: true
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      exporters: [otlp, debug]
    metrics:
      exporters: [prometheus, debug]
    logs:
      exporters: [debug]