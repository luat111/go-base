services:
  cache:
    container_name: cache
    image: redis:6.2-alpine
    restart: always
    ports:
      - ${CACHE_PORT}:6379
    command: redis-server --save 20 1 --loglevel warning --requirepass ${CACHE_PWD}
    volumes:
      - cache:/data
    networks:
      - go-base

  postgres:
    container_name: postgres
    restart: always
    image: postgres:latest
    env_file: .env
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PWD}
      POSTGRES_HOST: ${PG_HOST}
      POSTGRES_DB: ${PG_DB}
      PGDATA: /data/postgres
    volumes:
      - postgres:/data/postgres
    ports:
      - ${PG_PORT}:5432
    networks:
      - go-base
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgpool:
    container_name: pgpool
    image: pgpool/pgpool:latest
    restart: always
    env_file: .env
    environment:
      - PGPOOL_PARAMS_PORT=5432
      - PGPOOL_PARAMS_BACKEND_HOSTNAME0=postgres
      - PGPOOL_PARAMS_BACKEND_PORT0=5432
      - PGPOOL_PARAMS_BACKEND_WEIGHT0=1
      - PGPOOL_PARAMS_BACKEND_DATA_DIRECTORY0=/data/postgres
      - PGPOOL_PARAMS_SR_CHECK_USER=${PG_USER}
      - PGPOOL_PARAMS_SR_CHECK_PASSWORD=${PG_PWD}
      - PGPOOL_PARAMS_LOAD_BALANCE_MODE=on
      - PGPOOL_PARAMS_MAX_POOL=15
      - PGPOOL_PARAMS_CHILD_LIFE_TIME=300
      - PGPOOL_PARAMS_CONNECTION_LIFE_TIME=0
      - PGPOOL_PARAMS_CLIENT_IDLE_LIMIT=0
      - PGPOOL_PARAMS_ENABLE_POOL_HBA=on
      - PGPOOL_PARAMS_PASSWORD_ENCRYPTION_METHOD=scram-sha-256
      - PGPOOL_PARAMS_LDAP_ENABLED=off
      - PG_USERNAME=${PG_USER}
      - PG_PASSWORD=${PG_PWD}
      - PCP_USER=${PGPOOL_ADMIN_USER:-admin}
      - PCP_PASSWORD=${PGPOOL_ADMIN_PWD:-adminpassword}
    ports:
      - ${PGPOOL_PORT:-5433}:5432
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - go-base
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5432"]
      interval: 10s
      timeout: 5s
      retries: 5


  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    networks:
      - go-base
    ports:
      - ${RMQ_PORT}:5672
      - ${RMQ_UI_PORT}:15672
    environment:
      - RABBITMQ_DEFAULT_USER=${RMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RMQ_PWD}

networks:
  go-base:
    driver: bridge

volumes:
  cache:
    driver: local
  postgres:
    driver: local
